server:
  port: 8080

spring:
  application:
    name: lark-manager-backend

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.lark.oapi.core.Transport: DEBUG

lark:
  # api:
  #   enabled: true       # 总开关：false 时不注册 starter 的 REST 与 Webhook
  #   rest:
  #     enabled: true     # /api/lark/** JSON API（@LarkApi、统一响应、DEBUG 拦截器）
  #   webhook:
  #     enabled: true     # POST /api/lark/webhook（事件订阅回调）
  oapi:
    primary: default
    apps:
      default:
        app-id: ${APP_ID:}
        app-secret: ${APP_SECRET:}
        base-url: FEISHU # or LARK_SUITE
        marketplace-app: false
        verification-token: ${VERIFICATION_TOKEN:}
        encrypt-key: ${ENCRYPT_KEY:}
        request-timeout-ms: 30000
        log-req-at-debug: true
        disable-token-cache: false
      # another:
      #   app-id: ${APP2_ID:}
      #   app-secret: ${APP2_SECRET:}
      #   base-url: LARK_SUITE
