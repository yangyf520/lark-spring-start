server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: lark-manager-backend

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.lark.oapi.core.Transport: DEBUG
    com.larksuite.lark.app.openapi.AppOpenApiClient: DEBUG

lark:
  open:
    base-url: https://open.feishu.cn
    marketplace-app: false
    verification-token: ${VERIFICATION_TOKEN:}
    encrypt-key: ${ENCRYPT_KEY:}
    request-timeout-ms: 30000
    log-req-at-debug: true
    disable-token-cache: false
    apps:
      default:
        app-id: ${APP_ID:}
        app-secret: ${APP_SECRET:}
      # another:
      #   app-id: ${APP2_ID:}
      #   app-secret: ${APP2_SECRET:}

  apass:
    base-url: https://ae-openapi.feishu.cn
    apps:
      default:
        # Support both new and old env var names.
        id: ${OPENAPI_ID:${OPENAPI_CLIENT_ID:}}
        secret: ${OPENAPI_SECRET:${OPENAPI_CLIENT_SECRET:}}
        # Optional: pre-issued Authorization token (e.g. "T:xxxx"). If set, backend will skip /auth/v1/appToken.
        token: ${OPENAPI_TOKEN:}
        namespace: ${OPENAPI_NAMESPACE:}
      # another:
      #   id: ${OPENAPI2_ID:}
      #   secret: ${OPENAPI2_SECRET:}
      #   namespace: ${APP2_NAMESPACE:}
